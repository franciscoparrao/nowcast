[package]
name = "nowcast-h0"
description = "Zero-degree isotherm height (H0) as a two-way trigger modulator: absolute (summer rain where the freezing level is always high) and monthly-anomaly (winter warm storm). Orthogonal to rain intensity (r=-0.069), so it adds signal the rain gauge does not carry."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Deliberately core-only: the H0 series is a plain daily CSV and the date
# arithmetic is 20 lines, so this crate stays in the offline `std + thiserror`
# gate like nowcast-core itself. No chrono, no csv crate.
nowcast-core = { path = "../nowcast-core" }
